      Plomo, cadmio, arsénico, mercurio. Son nombres que asustan, y varios estudios recientes han encontrado algunos de ellos en comida comercial para gatos.

      Un trabajo con 45 alimentos felinos en China encontró cromo y arsénico en todas las muestras. Otro, con 75 productos en Líbano y 121 en Emiratos Árabes, halló más plomo en el pienso seco y más cadmio en el húmedo. Que aparezca un metal no quiere decir que el producto supere un límite legal. Importan la cantidad y cuánto come el animal con el tiempo.

      Lo práctico: no hay un formato siempre más seguro, así que cambiar de seco a húmedo no lo resuelve. Varía la dieta con criterio, pregunta a tu veterinario y no des sobras. Si te preocupa una marca concreta, la pregunta correcta es para él.

