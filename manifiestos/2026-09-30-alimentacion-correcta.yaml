  # --- Facebook: 3 párrafos + cierre, tono cercano ----------------------
  facebook:
    texto: |-
      Un plato de caldo casero y un cuenco de leche. Los dos buenos gestos más habituales de una casa con gatos, y los dos fallan. El caldo lleva cebolla casi siempre, y la cebolla —en trocitos, en polvo, en el fondo del bonito— destruye los glóbulos rojos del gato. Los gatos son mucho más sensibles a eso que los perros: basta una cantidad pequeña para hacer daño, y cocinar no lo evita. La leche no es tóxica, pero la mayoría de los gatos adultos han perdido la lactasa, la enzima que digiere el azúcar de la leche. No es que les haga daño: es que la digieren mal, y la siguiente es una diarrea.

      Para una colonia, la opción práctica es el pienso seco completo. No se estropea en el comedero, se guarda meses en un bote, se raciona bien y no atrae insectos ni roedores. Pero tiene un precio que hay que decir en voz alta: el gato que come seco bebe más del bebedero y, a la vez, ingiere menos agua en total. Por eso el bebedero limpio deja de ser un detalle y pasa a ser parte de la alimentación. En la práctica, una dieta solo de pienso seco se ha asociado en estudios con más problemas urinarios que una dieta mixta.

      Y luego está la lista de lo que no se da nunca: chocolate, café, alcohol, xilitol, uvas y pasas. Y lo que no es tóxico pero tampoco entra: el hueso cocido, que se astilla y puede perforar el intestino, el hígado en exceso, que envenena con vitamina A, y el pescado crudo, que destruye la tiamina, la vitamina B1 que el gato no puede fabricar. Todo eso se deja fuera, ni por cariño ni por costumbre.

      Si cuidas una colonia, registra en cada visita qué has dejado y cuánto. La comida también es un dato de campo, y en GeoGatos cabe en la misma visita que los gatos que viste. Un plato de más y uno de menos también se notan.
