plataformas:

  # --- Facebook: 2-3 párrafos + cierre, tono cercano ----------------------
  facebook:
    texto: |-
      Te descargas GeoGatos, abres el mapa y no ves ninguna colonia. Si no tienes código de confianza, el mapa no te muestra datos: ni colonias, ni visitas, ni gatos. 🐈‍⬛

      No es un fallo. Un mapa de colonias es, en la práctica, una lista de direcciones donde hay gatos que dependen de que alguien les lleve comida y agua cada día, y quien quisiera hacerles daño no encuentra nada. El código lo da alguien que ya está dentro y responde de ti: eso forma una red de personas fiables y, cuando el papel lo exige, la identidad se acredita con DNI, NIE o CIF. También sirve para saber qué papel tienes: ayuntamiento, protectora, veterinaria, comercio o voluntario. Y cada visita o incidencia queda registrada con quién, cuándo y dónde.

      Si cuidas una colonia, pídele el código a tu veterinaria o a tu protectora si están asociados a GeoGatos; si no lo están, diles que se pongan en contacto con nosotros, que es gratis. Estamos en Android (Play Store), en iOS y en la web: geogatos.com.
    hashtags:
      [
        "GeoGatos",
        "ColoniasFelinas",
        "Privacidad",
        "GatosCallejeros",
        "ProteccionAnimal"
      ]
    medios: ["facebook-01.jpg"]

  # --- Instagram: 1 párrafo, imagen única vertical 4:5 ---------------------
  instagram:
    tipo: "imagen_unica"
    texto: |-
      Abres GeoGatos sin código de confianza y el mapa está vacío: no ves ninguna colonia, ni visitas, ni gatos. No es un fallo. Un mapa de colonias es, en la práctica, una lista de direcciones donde hay gatos que dependen de alguien cada día, y así nadie puede usarlo para hacerles daño. El código lo da una persona que ya está dentro y responde de ti; también define tu papel: ayuntamiento, protectora, veterinaria, comercio o voluntario. Y cada visita o incidencia queda registrada con quién, cuándo y dónde. ¿Cuidas una colonia? Pídele el código a tu veterinaria o a tu protectora si están asociados a GeoGatos. 🐈‍⬛
    hashtags:
