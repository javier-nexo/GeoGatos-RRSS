# -----------------------------------------------------------------------------

plataformas:

  # --- Facebook: 2-3 párrafos + cierre, tono cercano ----------------------
  facebook:
    texto: |-
      Tres cachorros en una caja de cartón delante de tu puerta. El impulso es cogerlos y llevártelos a casa. Ese impulso es el primer error. 🐈‍⬛

      La madre casi siempre está fuera: comiendo, bebiendo o descansando donde no la molestan, y vuelve. Un cachorro caliente, con el vientre redondo y limpio, está bien alimentado, y eso significa que la gata está trabajando. No los toques ni los muevas de sitio: si cambias el nido, puede que ella ya no lo encuentre. Y no es cierto que los rechace porque huelas a humano: los gatos no abandonan a sus cachorros por eso.

      Observa sin tocar: aparta a los perros y a los niños, no reordenes la caja y vuelve a comprobarlos cada un par de horas. Si están calientes y con la barriga llena, la madre ha pasado. Y si están fríos, no dejan de llorar, tienen el vientre hundido, están sucios o heridos o hay peligro, entonces sí hay que actuar: con guantes o con una toalla, a una caja ventilada y al calor de tu cuerpo, y al veterinario cuanto antes. No les des leche de vaca: les da diarrea.

      Si hay una colonia en tu barrio, abre GeoGatos, búscala en el mapa y deja constancia de lo que has visto: un avistamiento o una incidencia con GPS, para que quien cuida de ellos sepa qué ha pasado y dónde. Si no hay colonia, créala. Ayuntamientos y protectoras gestionan las colonias con el método CER (Ley 7/2023), y una camada aparecida hoy casi siempre significa una gata por esterilizar.
    hashtags:
      [
        "GeoGatos",
        "ColoniasFelinas",
        "GatosCallejeros",
        "Gatitos",
        "ProteccionAnimal",
        "BienestarAnimal",
        "CER",
        "LeyAnimal"
      ]
    medios: ["facebook-01.jpg"]

  # --- Instagram: 1 párrafo, carrusel de 3 --------------------------------
  # La primera imagen fija el recorte de las otras dos.
  instagram:
    tipo: "carrusel"
    texto: |-
      Tres cachorros en una caja delante de tu puerta: no te los lleves. Si están calientes, con el vientre redondo y limpios, la madre está fuera comiendo y vuelve; si los cambias de sitio, puede que no los encuentre. Observa sin tocar: aparta a perros y niños, no muevas el nido y vuelve a comprobarlos cada un par de horas. Y no es cierto que los rechace porque huelas a humano. Sí hay que actuar si están fríos, si no dejan de llorar, si tienen el vientre hundido, si están sucios o heridos o si hay peligro: con guantes o una toalla, a una caja ventilada y al calor del cuerpo, y al veterinario. Déjalo todo registrado en GeoGatos con la ubicación, para que quien cuide de ellos sepa qué pasó y dónde. 🐈‍⬛
    hashtags:
      [
        "GeoGatos",
        "ColoniasFelinas",
        "GatosCallejeros",
        "Gatitos",
        "ProteccionAnimal",
        "BienestarAnimal",
        "CER",
        "Animalismo"
      ]
    medios:
      - "instagram-01.jpg"
      - "instagram-02.jpg"
      - "instagram-03.jpg"

  # --- LinkedIn: 3 párrafos, tono institucional (en standby) ---------------
  linkedin:
    texto: |-
      Una camada aparecida en un portal no es un hallazgo casual: es, casi siempre, una colonia sin gestionar y una gata por esterilizar.

      Lo que una persona encuentra en su puerta un martes por la mañana es una decisión que se toma en dos minutos, casi siempre a ciegas. El instinto es recoger a los cachorros y llevarlos a casa; la evidencia de campo dice que lo correcto, si están calientes y bien alimentados, es no tocarlos, porque la madre vuelve y un nido movido puede no ser encontrado. Cuando sí hay que intervenir, se hace sin protocolo: sin identificación, sin registro y sin trazabilidad de qué pasó, con quién y dónde.

      Desde la gestión de colonias, ese momento contiene tres datos que casi nunca se capturan. El primero, si la camada corresponde a una colonia censada o a un foco nuevo. El segundo, el estado real de la gata madre, que es quien decide el resultado del caso. El tercero, el más determinante a medio plazo: una camada aparecida significa, en la práctica, una hembra sin esterilizar, y la Ley 7/2023 obliga a los municipios a gestionar las colonias felinas mediante el método CER (Capturar-Esterilizar-Retornar). Sin registro, esa obligación no se puede cumplir ni demostrar.

      GeoGatos recoge ese momento como lo que es: un avistamiento o una incidencia con ubicación GPS y fotografías, ligado a la colonia y con responsable. El equipo que cuida de esa colonia ve el aviso en cuanto se registra, la colonia pasa a estar en el mapa con su color de atención y el caso queda trazado hasta que se resuelve. Lo que antes moría en un grupo de mensajes se convierte en un dato que un ayuntamiento o una protectora puede usar para planificar la siguiente operación CER.

      Si trabajas con colonias felinas y necesitas que los hallazgos de calle terminen en un registro verificable, visita geogatos.com.
    hashtags:
      [
        "GeoGatos",
        "ColoniasFelinas",
        "GestionDeColonias",
        "Ley7_2023",
        "CER",
        "BienestarAnimal",
        "ProteccionAnimal"
      ]
    medios: ["linkedin-01.jpg"]

  # --- X: 1 párrafo, máximo 280 caracteres contando el hashtag -------------
  # OJO: en self-serve X admite UN SOLO hashtag. El validador lo rechaza.
  # Sin URL en el texto: las URLs cuentan como 23 caracteres fijos.
  x:
    texto: |-
      Encuentras una camada en el portal: no te los lleves. Si están calientes y con el vientre redondo, la madre está fuera y vuelve. Si están fríos, no dejan de llorar o tienen el vientre hundido, entonces sí: veterinario y protectora. 🐈‍⬛
    hashtags: ["GeoGatos"]
    medios: ["x-01.jpg"]

