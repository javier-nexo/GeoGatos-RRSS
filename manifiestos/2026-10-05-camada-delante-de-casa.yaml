      Una camada en tu portal: no te los lleves. Si están calientes, la madre vuelve.
    hashtags: ["GeoGatos", "gatos", "Gatitos", "ColoniasFelinas", "ProteccionAnimal"]
    medios: ["tiktok-01.mp4"]

