      Educación de la app).

      Si algún día se automatiza, el runner manda el campo `texto` de este
      bloque como `contentFormat: markdown` y usa solo los 3 primeros tags.
    hashtags: ["GeoGatos", "ColoniasFelinas", "GatosCallejeros"]
    medios: ["medium-01.jpg"]

