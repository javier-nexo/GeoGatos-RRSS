      Esa punta de oreja cortada no es una herida: es la marca de que el gato ya está esterilizado. Se hace con el gato dormido, en la misma operación: se quitan unos 10 mm de la punta de la oreja izquierda y cura en pocos días, sin afectar al oído. Sirve para que nadie lo vuelva a atrapar para operarlo. Pero la oreja no lo dice todo: el microchip, del tamaño de un grano de arroz, guarda un número de 15 dígitos que se lee con un lector y confirma la identificación en el registro. Si dudas, que lo lea un veterinario. Y si no tiene ni marca ni chip, no lo des por hecho: obsérvalo y consulta. Anota las dos señales en la ficha de GeoGatos y te ahorras una segunda captura. 🐈‍⬛
