plataformas:

  # --- Facebook: 2-3 párrafos + cierre, tono cercano ----------------------
  facebook:
    texto: |-
      Puedes descargarte GeoGatos en un minuto. Pero sin código de confianza, entras como invitada: cuidas, registras y ayudas, pero no ves lo que suben los demás. Y ese es, precisamente, el motivo por el que existe la confianza.

      El principal motivo de los códigos de confianza es crear una red de personas fiables y comprometidas con los animales, dejando fuera a quien pudiera entrar a la app para hacer daño a los gatos urbanos. Quien se descarga la aplicación sin código es una persona "invitada": puede registrar colonias, visitas e incidentes, pero no puede ver la información que suben los demás. Así evitamos que una mala persona sepa dónde están ubicadas las colonias y vaya a hacerles daño. Ese es el motivo más importante por el que establecimos los códigos de confianza.

      En segundo lugar, los códigos determinan los roles de los distintos actores en la app: ayuntamiento, organización, veterinario, comercio aliado, voluntario o invitado. Cada uno ve y hace lo que le corresponde. En tercer lugar, tejen una red de relaciones entre personas, organizaciones, veterinarias y ayuntamientos: cada usuario llega avalado por otro, formando una cadena trazable hasta una organización verificada. Y cuando el rol lo exige, la identidad se comprueba de verdad con DNI, NIE o CIF y su carácter de control.

      Aunque alguien intentara leer la base de datos por fuera de la app, la seguridad está dentro: cada usuario solo ve las filas que le tocan. Cada dato de la colonia tiene una persona detrás que responde de él, y por eso se puede confiar. La app está en Android (Play Store), en iOS y en la web: geogatos.com. 🐈‍⬛
    hashtags:
      [
        "GeoGatos",
        "ColoniasFelinas",
        "GestionDeColonias",
        "ProteccionAnimal",
        "Ley7_2023",
        "CER",
        "Comunidad"
      ]
    medios: ["facebook-01.jpg"]

  # --- Instagram: 1 párrafo, carrusel de 3 --------------------------------
  instagram:
    tipo: "carrusel"
    texto: |-
      ¿Y si el que busca la colonia no es un cuidador? En GeoGatos, quien se descarga la app sin código entra como invitada: puede registrar colonias, visitas e incidentes, pero no ve lo que suben los demás. Así evitamos que alguien malintencionado sepa dónde están las colonias y vaya a hacer daño a los gatos. Es el motivo principal de los códigos de confianza: una red de personas fiables y comprometidas con los animales. Además, los códigos determinan los roles de cada actor (ayuntamiento, organización, veterinario, comercio, voluntario) y tejen una red de relaciones entre personas, organizaciones, veterinarias y ayuntamientos. Cuando el rol lo pide, la identidad se comprueba con DNI, NIE o CIF y su carácter de control, y la base de datos solo deja ver a cada uno lo que le toca. Cada dato de la colonia tiene una persona detrás. Entra en la cadena: GeoGatos está en Android (Play Store), en iOS y en la web. 🐈‍⬛
    hashtags:
      [
        "GeoGatos",
