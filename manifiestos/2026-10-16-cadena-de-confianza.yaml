  # --- LinkedIn: 3 párrafos, tono institucional (en standby) ---------------
  linkedin:
    texto: |-
      Un censo de colonias vale lo que valen las personas que hay detrás de cada dato. En GeoGatos no entra cualquiera a ver dónde están los gatos: quien se descarga la app sin código de confianza es una persona "invitada", que puede registrar colonias, visitas e incidentes, pero no puede ver la información que suben los demás. Así se evita que alguien con malas intenciones localice las colonias y haga daño a los animales. Ese es el motivo principal por el que existen los códigos de confianza: crear una red de personas fiables y comprometidas con los animales.

      En segundo lugar, los códigos determinan los roles de los distintos actores en la app: ayuntamiento, organización, veterinario, comercio aliado, voluntario e invitado. Cada uno ve y gestiona lo que le corresponde. En tercer lugar, los códigos tejen una red de relaciones entre personas, organizaciones, veterinarias y ayuntamientos: cada usuario llega avalado por otro, formando una cadena trazable hasta una organización verificada, y cuando el rol lo exige la identidad se comprueba con DNI, NIE o CIF y su carácter de control.

      El resultado es un registro auditable y seguro: cada colonia, visita e incidencia tiene detrás una persona identificada, y la seguridad a nivel de fila garantiza que cada usuario solo accede a lo que le corresponde, incluso si alguien intenta llegar a los datos por fuera de la app. Eso es lo que convierte un mapa en información en la que un ayuntamiento, una protectora o una clínica pueden apoyar una decisión. GeoGatos está disponible en Android, iOS y en la web (geogatos.com).
    hashtags:
