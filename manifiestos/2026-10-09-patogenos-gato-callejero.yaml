      Estornudos, ojos llorosos y un gato que deja de comer: en una colonia eso no es un resfriado. El catarro felino (herpesvirus y calicivirus) se extiende ahí donde todos comen del mismo sitio; la panleucopenia llega con vómitos y diarrea y pega mucho más fuerte en las crías; el FIV y el FeLV se pasan sobre todo por mordidas de pelea, no por compartir el plato; y el tiña, que no es un gusano sino un hongo de piel, también se va a las personas. Aprende a distinguir lo molesto de lo que no admite esperar: si respira raro, no se mueve, no come ni bebe o vomita, no esperes. Y nada de automedicación, ni antibióticos de la farmacia ni remedios de casa: eso lo decide el veterinario. Si lo ves, déjalo escrito en GeoGatos, con la ficha de salud del gato y una incidencia con GPS para que quien cuide de esa colonia sepa qué le pasa y dónde está. Estamos en Android (Play Store), en iOS y en la web. 🐈‍⬛
