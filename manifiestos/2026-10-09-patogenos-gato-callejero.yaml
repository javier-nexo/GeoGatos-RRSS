plataformas:

  # --- Facebook: 2-3 párrafos + cierre, tono cercano ----------------------
  facebook:
    texto: |-
      Estornudos que no paran, ojos llorosos y un gato que deja de comer. En la calle no es un resfriado: es la señal de que algo circula por la colonia.

      En una colonia las enfermedades viajan rápido: bocas juntas, el mismo agua, el mismo comedero y peleas que dejan heridas. Los cuatro que más se ven son el catarro felino (herpesvirus y calicivirus: estornudos, mocos y ojos que se cierran), la panleucopenia (vómitos y diarrea, sobre todo en crías y en colonias con muchos gatos), el FIV y el FeLV (se pasan sobre todo por mordidas de pelea, no por compartir el plato) y el tiña (un hongo de piel que también se va a las personas).

      Distinguir lo molesto de lo que no admite esperar es lo que salva gatos. Si respira raro, no se mueve, no come ni bebe, vomita o le hincha la cara, no hay que esperar a ver si se le pasa: hay que ir. Y nada de automedicación. Ni antibióticos de la farmacia ni remedios de casa, porque un antibiótico no cura un virus y en un gato decaído se puede empeorar todo.

      La buena noticia es que casi todo se resuelve si alguien lo ve a tiempo, y esa parte es tuya. En GeoGatos cada gato tiene su ficha con el estado de salud, puedes dejar una incidencia con GPS y fotos para que quien cuida de la colonia sepa qué le pasa y dónde está, y avisas a la comunidad entera de un golpe. La app está en Android (Play Store), en iOS y en la web: geogatos.com. Un gato que no come y que nadie registra es un gato que se pierde.
    hashtags:
      [
        "GeoGatos",
        "ColoniasFelinas",
        "GatosCallejeros",
        "SaludFelina",
        "ProteccionAnimal",
        "BienestarAnimal",
