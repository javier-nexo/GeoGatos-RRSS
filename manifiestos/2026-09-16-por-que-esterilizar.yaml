  # --- Facebook: 2-3 párrafos, tono cercano ---------------------------
  facebook:
    texto: |-
      Una sola gata sin esterilizar puede dejar más de 100 descendientes a lo largo de su vida fértil. Cada camada que nace en la calle se enfrenta a frío, hambre, enfermedades y atropellos, y casi ninguno tendrá una vida fácil.

      Esterilizar no es un trámite ni un castigo: es medicina preventiva. En las hembras elimina el riesgo de piometra y reduce drásticamente los tumores mamarios; en los machos, los tumores testiculares. Además desaparecen la mayor parte de las peleas, el marcaje y los maullidos de celo, así que la convivencia en el barrio mejora de forma medible.

      Cuando una colonia alcanza un porcentaje alto de esterilización, la población deja de crecer y se estabiliza sola, sin medidas traumáticas. Por eso la Ley 7/2023 obliga a los municipios a gestionar las colonias mediante el método CER, y por eso hace falta un registro serio de lo que se hace en cada operación.
    hashtags: ["GeoGatos", "ColoniasFelinas", "ProteccionAnimal"]
    medios: ["facebook-01.jpg"]

