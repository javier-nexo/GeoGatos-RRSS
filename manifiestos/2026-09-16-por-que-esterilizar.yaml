  # --- LinkedIn: 2-3 párrafos, tono institucional (en standby) ---------
  linkedin:
    texto: |-
      La Ley 7/2023 obliga a los municipios españoles a gestionar las colonias felinas mediante protocolos CER. En la práctica, eso significa que miles de localidades necesitan una herramienta para documentar cada operación con rigor: quién la hizo, cuándo, con qué resultado.

      La esterilización es el único método que estabiliza una población felina de forma ética y sostenida. Una gata sin esterilizar puede llegar a más de cien descendientes en su vida fértil, y cada capa que nace sin control se convierte en sobrepoblación, enfermedad y conflicto vecinal.

      GeoGatos cubre esa necesidad con trazabilidad completa: censo de gatos con estado de esterilización y microchip, registro de visitas, validación por GPS y un módulo CER con checklist legal de liberación. Para un ayuntamiento, eso no es una app de gatos: es un sistema de información para justificar su gestión. Descarga la app y registra la colonia de tu barrio.
    hashtags: ["GeoGatos", "ColoniasFelinas", "CER", "ProteccionAnimal", "LeyAnimal"]
    medios: ["linkedin-01.jpg"]

