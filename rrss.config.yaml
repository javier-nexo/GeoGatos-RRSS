# Configuración del pipeline de publicación (OpenCode → Make)
#
# Este archivo es la ÚNICA fuente de verdad de los ajustes de infraestructura.
# Si cambias de alojamiento de medios o de cuenta, edita solo aquí.

pipeline:
  # Versión del esquema de manifiestos. No la cambies sin migrar los manifiestos.
  version: 1

# ---------------------------------------------------------------------------
# Alojamiento de medios
# ---------------------------------------------------------------------------
# Instagram hace `curl` al archivo y TikTok exige URLs de un dominio verificado.
# Por eso los medios NO pueden quedarse en una carpeta local: necesitan HTTPS
# público. Ver docs/automacion-make.md para las dos拓扑icas posibles.
medios:
  # Carpeta local donde depositas las imágenes/vídeos antes de publicarlas.
  carpeta: "medios"

  # Dominio base que se antepone a las rutas de los ficheros.
  #
  # Opciones reales:
  #   - Repo de medios público, Pages desde la raíz:
  #       https://<usuario>.github.io
  #   - Repo de medios público, Pages desde /docs o /public:
  #       https://<usuario>.github.io/<repo>
  #   - Repo de contenido público, Pages desde /medios:
  #       https://<usuario>.github.io/<repo>
  #
  # CRÍTICO: este host es el que verificas en TikTok (URL prefix). Eliges uno
  # del que seas propietario; raw.githubusercontent.com NO es verificable.
  base_url: "https://javier-nexo.github.io/GeoGatos-Media"

  # Extensiones admitidas por tipo de medio.
  extensiones:
    imagen: [jpg, jpeg, png, webp]
    video: [mp4, mov, webm]

# ---------------------------------------------------------------------------
# Redes activas
# ---------------------------------------------------------------------------
# Poner en false una red hace que el validador la marque como BLOQUEADA y que
# Make la salte sin error. Las redes bloqueadas conservan su contenido para
# poder activarlas más adelante sin regenerar la publicación.
redes:
  facebook:
    activo: true
  instagram:
    activo: true
  linkedin:
    activo: true
  x:
    activo: true
  youtube:
    activo: true
  tiktok:
    activo: false
    # TikTok exige dos aprobaciones que no están automatizables:
    #  1. La app debe aprobar el scope `video.publish`.
    #  2. Sin superar la auditoría, TODO lo publicado queda en modo privado.
    motivo: "Pendiente de aprobación del scope video.publish + auditoría de la app"
  medium:
    activo: false
    # Medium cerró su API: el repositorio oficial de documentación está
    # archivado desde marzo de 2023 y advierte que ya no se soporta.
    # El único camino es un integration token autogenerado, sin garantía.
    motivo: "API de Medium sin soporte oficial (archivada en 2023)"

# ---------------------------------------------------------------------------
# Límites por plataforma
# ---------------------------------------------------------------------------
# Valores tomados de la documentación oficial de cada API.
# `verificado: true` significa que el dato está confirmado en la doc.
# Si una red cambia sus límites, corrige aquí y no en el validador.
limites:
  x:
    longitud_texto: 280
    # URLs se contabilizan como 23 caracteres.
    longitud_url: 23
    # REGLA CRÍTICA: en cuentas self-serve X limita a 1 cashtag por post.
    # Para permitir más hay que contratar el plan Enterprise.
    hashtags_max: 1
    medios_max: 4
    verificado: true
  instagram:
    longitud_texto: 2200
    # Instagram NO acepta PNG: el endpoint /media solo admite JPEG.
    # https://developers.facebook.com/docs/instagram-platform/content-publishing
    formatos_imagen: [jpg, jpeg]
    carrusel_max: 10
    hashtags_max: 30
    # Límite de publicaciones por cuenta en 24 h. La doc cita 100 y 50 en
    # secciones distintas; usamos el más restrictivo para ir sobre seguro.
    publicaciones_24h: 50
    verificado: true
  facebook:
    longitud_texto: 63206
    # Facebook no impone un tope real a los hashtags en posts de página.
    # El valor es una convención propia para no llenar el pie de texto.
    hashtags_max: 10
    medios_max: 10
    verificado: true
  linkedin:
    longitud_texto: 3000
    hashtags_max: 20
    medios_max: 20
    # Los carruseles orgánicos NO están soportados; multiImage sí.
    carrusel_organico: false
    verificado: true
  youtube:
    longitud_titulo: 100
    longitud_texto: 5000
    hashtags_max: 15
    medios_max: 1
    verificado: true
  tiktok:
    longitud_texto: 2200
    hashtags_max: 10
    video_duracion_max_s: 300
    # NO VERIFICADO contra la doc: la longitud exacta del caption depende del
    # tipo de post. 2200 es un valor conservador heredado de la v1 de la API.
    longitud_texto_verificado: false
  medium:
    longitud_titulo: 100
    # Solo se usan los 3 primeros tags y se ignoran los de más de 25 chars.
    tags_max: 3
    longitud_tag: 25
    formatos_imagen: [jpg, jpeg, png, gif, tiff]
    verificado: true

# ---------------------------------------------------------------------------
# Formato de salida de Make
# ---------------------------------------------------------------------------
salida:
  # Dónde escribe Make el resultado de cada publicación.
  registro: "registro/publicaciones.jsonl"
  # Si es true, tras publicar Make actualiza `estado` en el manifiesto y
  # confirma el cambio. Evita dependencias circulares de permisos.
  escribir_estado_en_repo: true
